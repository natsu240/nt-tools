services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: claude-otelcol
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./collector-config.yaml:/otel-output/collector-config.yaml
    command: ["--config=/otel-output/collector-config.yaml"]
    restart: unless-stopped

  elasticsearch:
    build: ./elasticsearch
    container_name: claude-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.4
    container_name: claude-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
